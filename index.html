<!doctype html>
<html>
    <head>
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />

        <title>PA#1</title>
        <link rel="stylesheet" href="./style.css" />
    </head>
    <body onload="init()">
        <div class="page-container">
            <div class="info-header">
                <h2>Kiss Surface Stereo & WebCam</h2>
                <p id="message">
                    Drag your mouse on the canvas to rotate the model.<br />
                    (On a touch screen, you can use your finger.)
                </p>
            </div>

            <div class="main-layout">
                <div id="canvas-holder">
                    <canvas width="700" height="700" id="webglcanvas" style="background-color: #1e1e1e"></canvas>
                </div>

                <div class="control-panel">
                    <div class="settings-block">
                        <h3>Stereo Settings</h3>
                        <div class="input-field">
                            <label for="eyeSep">Eye Separation: <span id="eyeSepVal">0.7</span></label>
                            <input
                                type="range"
                                id="eyeSep"
                                min="0"
                                max="2"
                                step="0.01"
                                value="0.7"
                                oninput="updateParams()" />
                        </div>
                        <div class="input-field">
                            <label for="fov">Field of View: <span id="fovVal">0.4</span></label>
                            <input
                                type="range"
                                id="fov"
                                min="0.1"
                                max="2.0"
                                step="0.01"
                                value="0.4"
                                oninput="updateParams()" />
                        </div>
                        <div class="input-field">
                            <label for="nearClip">Near Clipping: <span id="nearClipVal">8.0</span></label>
                            <input
                                type="range"
                                id="nearClip"
                                min="1.0"
                                max="15.0"
                                step="0.1"
                                value="8.0"
                                oninput="updateParams()" />
                        </div>
                        <div class="input-field">
                            <label for="convergence">Convergence: <span id="convergenceVal">14.0</span></label>
                            <input
                                type="range"
                                id="convergence"
                                min="5.0"
                                max="30.0"
                                step="0.1"
                                value="14.0"
                                oninput="updateParams()" />
                        </div>
                    </div>
                    <div class="reset-button-area">
                        <button onclick="resetParameters()">Reset</button>
                    </div>
                </div>
            </div>
        </div>
    </body>
    <script src="./Utils/trackball-rotator.js"></script>
    <script src="./Utils/m4.js"></script>
    <script src="./shader.gpu"></script>
    <script src="./Model.js"></script>
    <script src="./StereoCamera.js"></script>
    <script src="./Texture.js"></script>
    <script src="./main.js"></script>
</html>
